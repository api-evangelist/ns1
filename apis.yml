aid: ns1
name: NS1
description: >-
  NS1 (now IBM NS1 Connect) is a managed authoritative DNS, traffic management,
  and DDI platform. Its data-driven DNS steers traffic with real-time telemetry
  (Pulsar RUM), health-check monitoring, filter-chain traffic-steering policies,
  GeoDNS, and dedicated DNS. Everything is programmable through the NS1 REST API
  at api.nsone.net/v1, authenticated with an X-NSONE-Key API key, and supported by
  first-party SDKs (Python, Go, JavaScript, PHP), an Ansible module set, a
  Terraform provider, and a command-line interface. NS1 was acquired by IBM in
  2022 and is delivered as IBM NS1 Connect; the api.nsone.net API host and v1
  contract remain unchanged.
